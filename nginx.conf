server {
    listen 10000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Preserve methods, paths and query strings.
    location ~ ^/(api|oauth2)(/|$) {
        access_log off;

        proxy_pass ${BACKEND_UPSTREAM};

        # Required for HTTPS upstreams such as Render.
        proxy_ssl_server_name on;
        proxy_ssl_name $proxy_host;

        # Keep backend redirects and cookie policy on the public frontend origin.
        proxy_set_header Host $http_host;

        # Preserve the original public frontend host/protocol.
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_redirect off;
        proxy_intercept_errors off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
